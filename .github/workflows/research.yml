name: Refresh research feeds

on:
  schedule:
    - cron: "13 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: research-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build bundles/research.json
        run: perl scripts/build_research.pl

      - name: Commit if changed
        run: |
          if git diff --quiet -- bundles/research.json; then
            echo "No feed changes this cycle."
            exit 0
          fi
          git config user.name  "fantasymags-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bundles/research.json
          git commit -m "chore(research): refresh feeds [skip ci]"
          git push
