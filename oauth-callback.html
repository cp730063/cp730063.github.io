<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yahoo Authorization — FantasyMags</title>
<style>
  :root{color-scheme:light dark}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#11141a;color:#eef0f3;
    display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
  .card{max-width:520px;width:100%;background:#191d24;border:1px solid #2a2f38;border-radius:14px;padding:28px}
  h1{font-size:18px;margin:0 0 6px}
  .sub{color:#9aa1ac;font-size:13px;margin:0 0 16px}
  .code{font-family:ui-monospace,Consolas,monospace;font-size:21px;background:#0d0f13;border:1px solid #2a2f38;
    border-radius:9px;padding:14px 16px;word-break:break-all;user-select:all;line-height:1.4}
  button{margin-top:14px;padding:10px 18px;border-radius:8px;border:0;background:#34d399;color:#04140d;
    font-weight:700;cursor:pointer;font-size:14px}
  button:active{transform:translateY(1px)}
  p.note{color:#9aa1ac;font-size:13px;line-height:1.55;margin-top:16px}
</style>
</head>
<body>
  <div class="card">
    <h1>Yahoo authorization complete</h1>
    <p class="sub">Copy this code and paste it back into your chat.</p>
    <div id="out" class="code">Reading code…</div>
    <button id="copyBtn" type="button">Copy code</button>
    <p class="note">This page only reads the code from the URL Yahoo just sent your browser to — it doesn't transmit it anywhere. Safe to close once you've copied it.</p>
  </div>
<script>
  var qs = new URLSearchParams(location.search);
  var code = qs.get('code');
  var err = qs.get('error');
  var out = document.getElementById('out');
  if (code) out.textContent = code;
  else if (err) out.textContent = 'Error: ' + err + (qs.get('error_description') ? ' — ' + qs.get('error_description') : '');
  else out.textContent = 'No code found in the URL.';

  document.getElementById('copyBtn').addEventListener('click', function(){
    var btn = this;
    (navigator.clipboard ? navigator.clipboard.writeText(out.textContent) : Promise.reject())
      .then(function(){ btn.textContent = 'Copied!'; setTimeout(function(){ btn.textContent = 'Copy code'; }, 1500); })
      .catch(function(){ btn.textContent = 'Select the text above and copy manually'; });
  });
</script>
</body>
</html>
